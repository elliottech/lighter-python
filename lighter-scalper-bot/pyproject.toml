[tool.poetry]
name = "lighter-scalper-bot"
version = "0.1.0"
description = "A scalping assistant bot for the Lighter exchange."
authors = ["Jules"]

[tool.poetry.dependencies]
python = "^3.9"
lighter-sdk = {git = "https://github.com/elliottech/lighter-python.git"}
